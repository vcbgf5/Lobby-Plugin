# Moc launch pada (golden pressure plate)
launchpad:
  enabled: true
  forward-power: 1.6
  upward-power: 0.9
  cooldown-ms: 500

messages:
  spawn-set: "&aSpawn Lobby ustawiony w tym miejscu!"
  spawn-not-set: "&cSpawn Lobby nie jest jeszcze ustawiony. Użyj /setspawnlobby."

# co ile sekund odświeżać status/liczbę graczy portali (kolejka, launch pad, cząsteczki)
portal-refresh-seconds: 5

# co ile sekund sprawdzać czy zwolniło się miejsce dla graczy w kolejce
queue-check-seconds: 3

# portale serwerów tworzone przez /addserverhologram (fizyczne złote płytki) - NIE edytuj
# ręcznie w trakcie działania serwera
portals: {}

# Serwery pokazywane w GUI kompasu "Wybierz serwer" (hotbar) - NIEZALEŻNE od portali wyżej,
# gracz nie musi stać przy żadnym bloku. Status/liczba graczy i tak biorą się na żywo z tego
# samego pingu przez proxy. Możesz edytować ręcznie (display-name/description wspierają kolory
# przez &), icon to dowolny Material (np. GRASS_BLOCK, DIAMOND_SWORD) - reload przez /reloadlobby.
menu-servers:
  ecosmp:
    display-name: "&a&lEcoSMP"
    target-server: "EcoSMP"
    max-players: 100
    icon: GRASS_BLOCK
    description:
      - "&7Survival z ekonomią, home'ami"
      - "&7i handlem między graczami."
      - ""
      - "&eDołącz i zacznij budować!"
  boxpvp:
    display-name: "&c&lBoxPvP"
    target-server: "BoxPvP"
    max-players: 100
    icon: DIAMOND_SWORD
    description:
      - "&7Box PvP - pojedynki, generatory,"
      - "&7skrzynki i eventy w jednym miejscu."
      - ""
      - "&eDołącz do walki!"

# Reklamy/HUD nad hotbarem: jesli masz zainstalowany plugin HUDEngine, ten plugin sam wykrywa
# go przy starcie i rejestruje w nim wartosci "lobbyspawn:queue_position_<serwer>" oraz
# "lobbyspawn:portal_status_<serwer>" (online/offline) dla kazdego skonfigurowanego portalu,
# a takze "lobbyspawn:ads_text" (rotujaca reklama - ta sama lista co chat-ads.messages nizej),
# "lobbyspawn:queue_active_server"/"lobbyspawn:queue_active_position" (kolejka w ktorej gracz
# aktualnie czeka) i "lobbyspawn:pulse" (do animacji koloru). Sam wyglad HUD-a projektujesz w
# configu samego HUDEngine (plugins/HUDEngine/huds/...), definiujac tam cztery HUD-y:
#   lobbyspawn_ads          - reklama, wlaczana/wylaczana automatycznie na dolaczeniu/wyjsciu
#   lobbyspawn_queue_spot   - popup pokazywany na queue-spot-popup-ticks, gdy zwolni sie miejsce
#   lobbyspawn_queue_status - maly widget widoczny caly czas, gdy gracz czeka w kolejce
#   lobbyspawn_teleport     - popup pokazywany na teleport-popup-ticks przy KAZDEJ teleportacji
#                             na inny serwer (plyta ladujaca, bez kolejki)
# Wszystkie cztery chowaja sie same, gdy gracz ma otwarty jakikolwiek ekran (ekwipunek, skrzynia...).
# Gotowe pliki dla folderu plugins/HUDEngine/ (huds/layouts/texts/images/assets) sa w paczce
# lobbyspawn-hudengine-pack. Bez HUDEngine te elementy po prostu sie nie pojawiaja - reszta
# pluginu dziala normalnie.

# ile tickow (20 = 1 sekunda) ma byc widoczny popup "lobbyspawn_queue_spot" w HUDEngine
queue-spot-popup-ticks: 100

# ile tickow (20 = 1 sekunda) ma byc widoczny popup "lobbyspawn_teleport" w HUDEngine
teleport-popup-ticks: 40

# dodatkowa, NAPRAWDĘ klikalna reklama na czacie (boss bar wyżej nie obsługuje kliknięć w vanilla Minecraft)
# każdy wpis ma "text" i albo "url" (otwiera link po kliknięciu) albo "command" (wykonuje komendę po kliknięciu)
chat-ads:
  enabled: true
  interval-seconds: 300
  messages:
    - text: "&e&lSKLEP &7- kliknij, aby otworzyc sklep.przyklad.pl"
      url: "https://sklep.przyklad.pl"
    - text: "&b&lDISCORD &7- kliknij, aby dolaczyc"
      url: "https://discord.gg/przyklad"
    - text: "&a&lVOTE &7- kliknij, aby zaglosowac"
      command: "/vote"
